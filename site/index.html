<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Papaver</title>
  <meta name="description" content="Papaver sprawdza dokumenty postępowań zakupowych i zwraca flagi z dowodem w źródle.">
  <style>
    :root { --bg: #fbfaf8; --fg: #1c1b1a; --muted: #6b6762; --accent: #b3261e; }
    @media (prefers-color-scheme: dark) { :root { --bg: #151413; --fg: #ecebe8; --muted: #a29d96; --accent: #e5736b; } }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 40rem; margin: 0 auto; padding: 18vh 16px 4rem; }
    h1 { font-size: 2.5rem; margin: 0 0 .5rem; letter-spacing: -.02em; }
    h1 span { color: var(--accent); }
    p { margin: 0 0 1rem; }
    .muted { color: var(--muted); }
    a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <h1>Papaver<span>.</span></h1>
    <p>Sprawdzamy dokumenty zakupowe i zwracamy flagi z dowodem w źródle. Decyzję podejmuje człowiek.</p>
    <p class="muted">Projekt w budowie. <a href="https://github.com/papaverlabs/papaver">Kod i dokumentacja na GitHubie</a>.</p>
  </main>
</body>
</html>
